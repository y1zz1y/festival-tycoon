<!doctype html><html lang="de"><meta charset="utf-8"><title>Festival Render Performance</title>
<style>body{margin:0;background:#233c37;color:white;font:12px monospace}canvas{width:100vw;height:100vh;display:block}aside{position:absolute;top:8px;left:8px;max-height:90vh;overflow:auto;background:#18322eee;padding:10px}pre{white-space:pre-wrap;max-width:650px}</style>
<canvas id="game-canvas"></canvas><aside><button id="run">Messung starten</button><select id="speed"><option value="0">Pause</option><option value="1" selected>1×</option><option value="2">3×</option><option value="3">8×</option></select><pre id="result">Lade Testkopie …</pre></aside>
<script type="module">
// Browser render harness. Loads a versioned fixture (?fixture=festivalmittel, the
// default) from tests/fixtures/performance/ or a personal copy (?save=name.json)
// from saves/, renders it with the real WorldView and reports frame, scene and
// render times plus what the GPU is asked to do: draw calls per frame, triangles,
// meshes and distinct materials. ?autorun=1 measures on load and leaves the result
// in window.__renderReport. The camera stays where WorldView puts it for the
// world, so the same fixture gives comparable numbers before and after a change.
import { GameState } from '../src/game/GameState.ts';
import { WorldView } from '../src/view/WorldView.ts';
const params=new URLSearchParams(location.search);
const noop=()=>{}, canvas=document.querySelector('canvas'), output=document.querySelector('#result');
const view=new WorldView(canvas,noop,noop,noop,noop,noop,noop,noop,noop);
window.__view=view; // for console diagnostics while measuring
const save=params.get('save'), fixture=params.get('fixture')||'festivalmittel';
const source=save?`/saves/${encodeURIComponent(save)}`:`/tests/fixtures/performance/${encodeURIComponent(fixture)}.json`;
const slot=await (await fetch(source)).json();
const raw=typeof slot.snapshot==='string'?slot.snapshot:JSON.stringify(slot);
const label=save?(slot.name??save):fixture;
let game, running=false, totals={}, samples=[], frames=[], draws=[], longTasks=[], init, measureStart=0;
const frameCount=Math.max(180,Math.min(3600,Number(params.get('frames'))||180));
const methods=['rebuildBuildings','rebuildTerrain','rebuildTerrainIfNeeded','updateVisitors','updateCoasterTrains','updateDayNight','updatePreview'];
function watch(target,key,label){const original=target?.[key];if(!original)return;target[key]=function(...args){const t=performance.now();try{return original.apply(this,args)}finally{if(running){const ms=performance.now()-t,r=totals[label]??={ms:0,calls:0,max:0};r.ms+=ms;r.calls++;r.max=Math.max(r.max,ms)}}}}
methods.forEach(key=>watch(view,key,key));
for(const key of ['campingView','medicalView','incidentView','logisticsView','supplyChainView','powerView','festivalLights','staffView','panicView','crowdingView','fireworksView']) watch(view[key],'update',`${key}.update`);
new PerformanceObserver(list=>{if(running)longTasks.push(...list.getEntries().filter(x=>x.startTime>=measureStart).map(x=>x.duration))}).observe({type:'longtask',buffered:true});
const stats=a=>{const s=[...a].sort((a,b)=>a-b);return {median:s[Math.floor(s.length*.5)],p95:s[Math.floor(s.length*.95)],max:s.at(-1)}};
// What the scene holds, visible or not: every Mesh (instanced ones counted once) and
// every distinct material behind them. A model that brings its own materials per
// placed object shows up here long before it shows up in the frame time.
function sceneCensus(){const materials=new Set();let meshes=0,instanced=0,visible=0;view.scene.traverse(o=>{if(!o.isMesh&&!o.isSprite&&!o.isLine)return;meshes++;if(o.isInstancedMesh)instanced++;if(o.visible)visible++;for(const m of [].concat(o.material??[]))materials.add(m)});return {meshes,instanced,visible,materials:materials.size}}
function initialize(){game=GameState.fromJSON(raw);game.setSpeed(Number(document.querySelector('#speed').value));view.invalidate();const t=performance.now();view.update(game.snapshot,1,game.worldRevision);const r=performance.now();view.render();init={scene:r-t,render:performance.now()-r};}
function report(){const result={source:label,speed:game.snapshot.speed,visitors:game.snapshot.visitors.length,buildings:game.snapshot.buildings.length,viewport:[canvas.clientWidth,canvas.clientHeight],frames:frames.length,init,frame:stats(frames),simulation:stats(samples.map(x=>x[0])),scene:stats(samples.map(x=>x[1])),render:stats(samples.map(x=>x[2])),drawCalls:stats(draws),triangles:view.renderer.info.render.triangles,geometries:view.renderer.info.memory.geometries,textures:view.renderer.info.memory.textures,programs:view.renderer.info.programs.length,census:sceneCensus(),longTasks:stats(longTasks),methods:Object.fromEntries(Object.entries(totals).sort((a,b)=>b[1].ms-a[1].ms))};window.__renderReport=result;output.textContent=JSON.stringify(result,null,2)}
let last=0;
function frame(t){if(!running)return;const delta=Math.min(.1,(t-last)/1000);frames.push(t-last);last=t;const a=performance.now();game.tick(delta);const b=performance.now();view.update(game.snapshot,game.renderAlpha,game.worldRevision);const c=performance.now();view.render();samples.push([b-a,c-b,performance.now()-c]);draws.push(view.renderer.info.render.calls);if(samples.length>=frameCount){running=false;report();}else requestAnimationFrame(frame)}
function run(){if(running)return;initialize();totals={};samples=[];frames=[];draws=[];longTasks=[];window.__renderReport=null;output.textContent=`Messung läuft: ${frameCount} Frames`;running=true;measureStart=last=performance.now();requestAnimationFrame(frame)}
document.querySelector('#run').onclick=run;
initialize();output.textContent=JSON.stringify({ready:true,source:label,init,draws:view.renderer.info.render.calls,triangles:view.renderer.info.render.triangles,geometries:view.renderer.info.memory.geometries,census:sceneCensus()},null,2);
if(params.get('autorun')) run();
</script></html>
