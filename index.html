<!doctype html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#22372f" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Headliner Tycoon" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" sizes="180x180" href="/app-icons/apple-touch-icon.png" />
    <link rel="icon" type="image/png" sizes="192x192" href="/app-icons/icon-192.png" />
    <title>Headliner Tycoon</title>
    <script>
      // The language of this page load, before any module arrives. Mirrors
      // src/i18n/locale.ts step for step (tests/i18n.ts runs both on the same cases):
      // readLanguageSetting — the device setting `language` in festival-player-settings,
      // anything unreadable counts as 'auto' — then detectLocale/resolveLocale — 'auto'
      // follows the browser, English is the fallback, a failing navigator means German.
      (function () {
        var setting = 'auto'
        try {
          var stored = localStorage.getItem('festival-player-settings')
          var parsed = stored ? JSON.parse(stored) : null
          if (parsed && typeof parsed === 'object') setting = parsed.language
        } catch (error) {
          setting = 'auto'
        }
        var locale = 'de'
        try {
          if (setting === 'de' || setting === 'en') locale = setting
          else {
            locale = 'en'
            var languages = navigator.languages || []
            for (var i = 0; i < languages.length; i++) {
              var primary = languages[i].toLowerCase().split('-')[0]
              if (primary === 'de' || primary === 'en') { locale = primary; break }
            }
          }
        } catch (error) {
          locale = 'de'
        }
        document.documentElement.lang = locale
      })()
    </script>
    <style>
      /* Inline and independent of style.css on purpose: this has to paint the instant the
         raw HTML parses, before the module graph (main.ts and everything it imports,
         including style.css) has even been fetched. */
      #boot-loader {
        position: fixed;
        inset: 0;
        z-index: 9999;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 18px;
        background: #17241f;
        color: #edf7f1;
        font-family: 'Tahoma', 'Verdana', system-ui, sans-serif;
        opacity: 1;
        transition: opacity .35s ease;
      }
      #boot-loader.boot-loader-hide {
        opacity: 0;
        pointer-events: none;
      }
      .boot-ring {
        position: relative;
        width: 84px;
        height: 84px;
        display: grid;
        place-items: center;
      }
      .boot-ring::before {
        content: '';
        position: absolute;
        inset: 0;
        border-radius: 50%;
        border: 5px solid #344d48;
        border-top-color: #efcf86;
        border-right-color: #efcf86;
        animation: boot-spin 0.9s linear infinite;
      }
      .boot-mark {
        display: grid;
        place-items: center;
        width: 50px;
        height: 50px;
        border-radius: 10px;
        color: white;
        background: linear-gradient(135deg, #ffb736, #e66e32);
        font-size: 26px;
        font-weight: 800;
        box-shadow: inset 0 1px rgba(255, 255, 255, 0.45);
      }
      .boot-title {
        font-size: 20px;
        font-weight: 800;
        letter-spacing: 0.04em;
      }
      .boot-caption {
        font-size: 12px;
        letter-spacing: 0.28em;
        text-transform: uppercase;
        color: #efcf86;
      }
      /* Both captions ship; <html lang> set by the script above picks one. */
      .boot-caption [lang] { display: none; }
      html:not([lang="en"]) .boot-caption [lang="de"],
      html[lang="en"] .boot-caption [lang="en"] { display: inline; }
      .boot-bar {
        width: 220px;
        height: 8px;
        background: #22352e;
        border: 1px solid #3f5a4f;
        box-shadow: inset 1px 1px #17241f;
      }
      .boot-bar-fill {
        height: 100%;
        width: 0%;
        background: linear-gradient(90deg, #c4a45a, #efcf86);
        transition: width .12s linear;
      }
      @keyframes boot-spin {
        to { transform: rotate(360deg); }
      }
      @media (prefers-reduced-motion: reduce) {
        .boot-ring::before { animation: none; }
      }
    </style>
  </head>
  <body>
    <div id="boot-loader" role="status" aria-live="polite">
      <div class="boot-ring"><div class="boot-mark">H</div></div>
      <div class="boot-title">Headliner Tycoon</div>
      <div class="boot-caption"><span lang="de">Wird geladen …</span><span lang="en">Loading …</span></div>
      <div class="boot-bar"><div class="boot-bar-fill"></div></div>
    </div>
    <div id="app"></div>
    <script type="module" src="/src/boot.ts"></script>
    <script>
      // Safety net: if boot ever fails to reach the point where main.ts removes this
      // itself, don't leave the player staring at a spinner forever.
      setTimeout(function () {
        var loader = document.getElementById('boot-loader')
        if (loader) loader.remove()
      }, 20000)
    </script>
  </body>
</html>
